server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri /index.html;
  }

  # >>> СПЕЦИАЛЬНО для аудиопотока (ставим ПЕРЕД общим /api/)
  location = /api/stream {
    proxy_pass http://api:8080/api/stream;
    proxy_http_version 1.1;

    # без буферизации, чтобы Range-стрим шёл напрямую
    proxy_request_buffering off;
    proxy_buffering off;

    # корректный проброс заголовков для <audio> Range
    proxy_set_header Connection "";
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;

    # помогаем клиенту понять, что поддерживается диапазон
    add_header Accept-Ranges bytes;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
  }

  # Общее проксирование API
  location /api/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

